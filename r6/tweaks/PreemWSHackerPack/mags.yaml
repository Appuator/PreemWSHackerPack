# The add-on's barrel items (SPEC §3). A barrel's effect comes from its hit hook; its only stat is the
# damage it costs. Record IDs are save-visible: never rename one once released.

# 10 % less damage, as a multiplier on DPS, which core's Extra Barrel also changes (core's barrels.yaml).
Items.PHB_MagDamagePenalty:
  $type: gamedataConstantStatModifier_Record
  modifierType: Multiplier
  statType: BaseStats.DPS
  value: 0.9

Items.PHB_HackerMag:
  $base: Items.SimpleWeaponMod01
  placementSlots: [AttachmentSlots.PreemMagazineMod01, AttachmentSlots.PreemMagazineMod02]
  statModifiers: [Items.PHB_MagDamagePenalty]

