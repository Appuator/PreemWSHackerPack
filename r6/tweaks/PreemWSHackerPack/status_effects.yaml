# The barrels' status effects (SPEC §4). Tuning lives here: max stacks, duration, and the flats
# stackInterval and ramPerStack, which the hooks read by name.
# Flats are spelled out as vanilla's stacking effects set them, rather than left to $type's defaults.
# Only Breach has uiData (SPEC §7), and its name is the user's text. Its icon needs the Debuff tag,
# and vanilla's finisher and poise bonuses come with that tag. The upload barrels' charges have neither.

BaseStatusEffect.PHB_Breach:
  $type: gamedataStatusEffect_Record
  statusEffectType: BaseStatusEffectTypes.Misc
  gameplayTags: [Debuff]
  uiData:
    $type: gamedataStatusEffectUIData_Record
    displayName: "BreachStacks"
    iconPath: "decreased_stats_icon"
    # 0 hides the icon on the enemy. Vanilla's quickhack icons sit below 0 too (Cripple Movement: -9).
    priority: -10.0
  removeAllStacksWhenDurationEnds: true
  isAffectedByTimeDilationNPC: true
  isAffectedByTimeDilationPlayer: true
  savable: true
  stopActiveSfxOnDeactivate: true
  maxStacks:
    $type: gamedataStatModifierGroup_Record
    statModsLimit: -1
    statModifiers:
      - $type: gamedataConstantStatModifier_Record
        modifierType: Additive
        statType: BaseStats.MaxStacks
        value: 5.0
  duration:
    $type: gamedataStatModifierGroup_Record
    statModsLimit: -1
    statModifiers:
      - $type: gamedataConstantStatModifier_Record
        modifierType: Additive
        statType: BaseStats.MaxDuration
        value: 8.0

# Plain flats beside the record: TweakXL refuses a property the record type doesn't have.
BaseStatusEffect.PHB_Breach.stackInterval: 0.2
BaseStatusEffect.PHB_Breach.ramPerStack: 1

